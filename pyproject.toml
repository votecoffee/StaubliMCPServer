[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "staubli-workbench"
version = "0.1.0"
description = "Standalone SRS project workbench and JSON CLI for Stäubli engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8"]

[project.scripts]
staubli = "staubli_workbench.cli:main"

[project.gui-scripts]
staubli-gui = "staubli_workbench.gui:main"

[project.urls]
Repository = "https://github.com/votecoffee/StaubliMCPServer"

[tool.setuptools.packages.find]
include = ["staubli_workbench*"]
